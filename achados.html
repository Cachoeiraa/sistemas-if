<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achados e Perdidos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-linha">
      <a class="voltar" href="index.html">&larr; Voltar</a>
      <h1>Achados e Perdidos</h1>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="toggle">
        <button type="button" id="btn-achado" class="ativo">Achei um item</button>
        <button type="button" id="btn-perdido">Perdi um item</button>
      </div>

      <form id="form-post" class="estilo">
        <input type="hidden" name="tipo" id="tipo" value="achado" />

        <label>
          Seu nome *
          <input name="nome" type="text" required placeholder="Ex.: Ana Souza — 2ºB" />
        </label>

        <div id="campos-achado" class="linha">
          <label>
            Onde achou *
            <input name="ondeAchou" type="text" placeholder="Ex.: Quadra, perto do bebedouro" />
          </label>
          <label>
            Onde deixou *
            <input name="ondeDeixou" type="text" placeholder="Ex.: Secretaria, com o prof. João" />
          </label>
        </div>

        <label id="campo-descricao">
          Descrição <span id="desc-opcional">(opcional)</span>
          <textarea name="descricao" rows="3" placeholder="Ex.: Estojo azul com canetas"></textarea>
        </label>

        <label>
          Foto (opcional)
          <input name="foto" type="file" accept="image/*" />
        </label>

        <p class="dica">O post some automaticamente depois de 5 dias.</p>
        <p id="form-feedback" class="feedback" hidden></p>

        <div class="botoes">
          <button type="submit" id="btn-enviar" class="btn-primario">Postar</button>
        </div>
      </form>
    </section>

    <section>
      <h2 style="margin-bottom: 1rem; font-size: 1.1rem;">Posts recentes</h2>
      <div id="feed" class="feed"></div>
      <p id="feed-vazio" class="vazio" hidden>Nenhum post por aqui.</p>
    </section>
  </main>

  <footer>
    <p>Achou algo? Poste rápido — alguém pode estar procurando.</p>
  </footer>

  <script src="comum.js"></script>
  <script src="achados.js"></script>
</body>
</html>
